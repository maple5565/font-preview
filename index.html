<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>솜담소 폰트 미리보기</title>

    <!-- 디자인 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
            <!-- 페이지 제목 -->
    <div class="page-title">
        <h1>솜담소 캡슐 네임 스탬프</h1>
        <p>폰트 미리보기</p>
    </div>

        <!-- 입력창 -->
        <input
            type="text"
            id="textInput"
            class="text-input"
            placeholder="텍스트를 적어주세요"
            value=""
        >

        <!-- 안내문 -->
        <div class="notice">
            <p>폰트 종류에 따라 실제 제작 시</p>
            <p>
                <strong>글자가 미리보기보다 조금 더 두껍게 표현될 수 있습니다.</strong>
            </p>
        </div>


        <!-- 폰트 미리보기 -->
        <div class="font-list">

            <div class="font-item">
                <span class="font-number">1번</span>
                <span class="preview-text font1">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">2번</span>
                <span class="preview-text font2">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">3번</span>
                <span class="preview-text font3">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">4번</span>
                <span class="preview-text font4">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">5번</span>
                <span class="preview-text font5">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">6번</span>
                <span class="preview-text font6">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">7번</span>
                <span class="preview-text font7">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">8번</span>
                <span class="preview-text font8">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">9번</span>
                <span class="preview-text font9">솜담소</span>
            </div>

            <div class="font-item">
                <span class="font-number">10번</span>
                <span class="preview-text font10">솜담소</span>
            </div>

        </div>

    </div>


    <!-- 기능 파일 연결 -->
    <script src="script.js"></script>

</body>
</html>
